title: The slow dependency
level: 2
concepts: [timeouts, retry storms, circuit breakers, metastable failure]
minutes: 40

# Available to Docker at --scale 1, Loadlore's own containers included.
# reference and speed: the machine its numbers come from and its host speed
# index; loadl run warns below 75% of this. pricing's capacity is CPU time
# per request on its own CPU, so it moves less with the host's core speed
# than the level-1 scenarios do.
host:
  cpus: 6
  memory: 4g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [retry-storm]
    signals: [errors]
  solutions:
    # helps: holds. The load is flat, so a solution's peak throughput
    # matches the starting design's before the pause; it has to absorb
    # the pause in a stall of one window or less.
    circuit-breaker: { verdict: held }
    fewer-retries: { verdict: held }
  variants:
    # Backoff with jitter spreads the retries out, but a failing request
    # still makes four calls.
    backoff-only: { verdict: broke, diagnoses: [retry-storm] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml.
predict:
  - ask: Pricing stops for two seconds at 2:01. What do users see while it's stopped?
    answer: text
    expect: 'note: "during the pause: {answer}"'
  - ask: How long after pricing starts again do the errors stop?
    answer: text
    expect: 'note: "errors stop: {answer}"'
  - ask: How many calls does pricing get for each user request after the pause?
    answer: text
    expect: 'note: "calls per request after the pause: {answer}"'
  - ask: Which component is the busiest a minute after the pause?
    answer: service
    expect: 'note: "{answer} is the busiest after the pause"'
