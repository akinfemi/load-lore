title: The live vote
level: 2
concepts: [row locks, hot rows, lock contention, counters]
minutes: 40

# Available to Docker at --scale 1, Loadlore's own containers included:
# 5.8 CPUs for the starting design, 6.8 for variants/bigger-db, 6.4
# for solutions/redis-tally.
# reference and speed: the machine the scenario was checked on and the
# host speed index loadl run printed there; it warns on a much slower host.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1033

# Load generator VUs started before the load, at --scale 1, measured: the
# larger of the peak rate x slo.p99_ms (2,000 x 0.5 s) and 1.5 x the most
# VUs busy at once before a break in any of the check's runs (8).
load:
  prealloc_vus: 1000
  peak_vus: 8
  from: live-vote-20261118-103630

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [hot-rows]
  solutions:
    # helps: holds the whole ramp and the minute at its peak.
    redis-tally: {}
  variants:
    # The database's CPU went on the contention: twice of it still breaks
    # on hot rows.
    bigger-db: { verdict: broke, diagnoses: [hot-rows] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line. The scored question is the relative one: whether twice the
# database's CPU holds the vote. Its answer goes into
# variants/bigger-db/design.yaml, the design with that change, and that
# run scores it. It's the stable result: bigger-db never held. On gp3 it
# broke 1:00 into the load at 688 rps, the same moment and load as the
# starting design (an earlier gp3 check, on a ramp to 4,500 rps, broke
# both 0:30 into the load at 827 rps). On the host's own disk before, it
# broke 2:50 and 4:10 into the load (the starting design 2:50 to 3:50),
# and in the two checks before the hold it collapsed in the ramp's last
# window. The Redis tally always held.
#
# The load guess is a loose, secondary question. Where hot rows tip over
# moves from run to run: on the host's own disk, before gp3, the starting
# design's breaks over three checks on the reference machine spread too
# far for 25% at the same host speed, and 35% scored every break seen
# right against every other. On gp3 it broke at 688 rps in this check
# (and at 827 rps in an earlier one on a ramp to 4,500 rps: a different
# profile, so not a measure of the spread). How far breaks spread over
# repeated checks on gp3 isn't measured yet, so it keeps scoring right
# within 35%, not the usual 25%, too high or too low both counting as
# wrong.
#
# The load ramps from 200 to 2,000 rps over 4 minutes, then holds 2,000
# for a minute, so a late break counts: a design that gave out in the
# ramp's last window was only a stall, and the check came out
# inconclusive.
predict:
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
  - ask: How busy is the database's CPU when it does?
    answer: text
    expect: 'note: "database CPU when it gives out: {answer}"'
  - ask: Would a database with twice the CPU take the vote without breaking? Answer yes or no. Your answer goes into variants/bigger-db/design.yaml, this design with twice the database's CPU, and its run scores it.
    answer: yesno
    design: variants/bigger-db/design.yaml
    expect: break_load_rps none
    no: break_load_rps any
  - ask: At what offered load, in requests per second, will this design break? The load ramps from 200 to 2,000 rps, then holds there for a minute. A rough guess is fine, and it scores loosely, within 35%; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 35% of {answer}
    never: break_load_rps none
