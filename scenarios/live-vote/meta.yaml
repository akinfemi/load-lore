title: The live vote
level: 2
concepts: [row locks, hot rows, lock contention, counters]
minutes: 40

# Available to Docker at --scale 1, Loadlore's own containers included:
# 6.8 CPUs for the starting design, 7.8 for variants/bigger-db.
# reference and speed: the machine the scenario was checked on and the
# host speed index loadl run printed there; it warns on a much slower host.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1031

# Load generator VUs started before the load, at --scale 1, measured: the
# larger of the peak rate x slo.p99_ms (4,500 x 0.5 s) and 1.5 x the most
# VUs busy at once before a break in any of the check's runs (44).
load:
  prealloc_vus: 2250
  peak_vus: 44
  from: live-vote-bigger-db-20261116-094822

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [hot-rows]
  solutions:
    # helps: holds the whole ramp and the minute at its peak.
    redis-tally: {}
  variants:
    # The database's CPU went on the contention: twice of it still breaks
    # on hot rows.
    bigger-db: { verdict: broke, diagnoses: [hot-rows] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml. A load guess scores right within 35% here, not the
# usual 25%, too high or too low both count as wrong: the breaks moved
# between about 3,335 and 4,410 rps over the checks, and at 25% a guess
# equal to one run's break (3,335) would score wrong against another's
# (4,410, +32%). At 35%, every break seen scores right against every
# other.
#
# The load ramps from 200 to 4,500 rps over 4 minutes, then holds 4,500
# for a minute. The hold is there so a late
# break counts: hot rows tip over at a load that moves from run to run
# (2:50 to 3:50 into the ramp over three checks on the reference machine,
# 3:10 to 3:50 for bigger-db), and a design that gave out in the ramp's
# last window was only a stall, so the check came out inconclusive.
predict:
  - ask: At what offered load, in requests per second, will it break? The load ramps from 200 to 4,500 rps, then holds there for a minute. A rough guess is fine; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 35% of {answer}
    never: break_load_rps none
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
  - ask: How busy is the database's CPU when it does?
    answer: text
    expect: 'note: "database CPU when it gives out: {answer}"'
  - ask: If you gave the database twice the CPU, what would happen?
    answer: text
    expect: 'note: "twice the CPU: {answer}"'
