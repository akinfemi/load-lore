title: The live vote
level: 2
concepts: [row locks, hot rows, lock contention, counters]
minutes: 40

# Available to Docker at --scale 1, Loadlore's own containers included:
# 5.8 CPUs for the starting design, 6.8 for variants/bigger-db, 6.4
# for solutions/redis-tally.
# reference and speed: the machine the scenario was checked on and the
# host speed index loadl run printed there; it warns on a much slower host.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1031

# Measured before disk profiles: its designs keep their disks until its
# next re-measure, so its reference results don't change. Then each
# Postgres names a profile (disk: { profile: gp3 }) and this line goes.
disk: legacy

# Load generator VUs started before the load, at --scale 1, measured: the
# larger of the peak rate x slo.p99_ms (4,500 x 0.5 s) and 1.5 x the most
# VUs busy at once before a break in any of the check's runs (44).
load:
  prealloc_vus: 2250
  peak_vus: 44
  from: live-vote-bigger-db-20261116-094822

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [hot-rows]
  solutions:
    # helps: holds the whole ramp and the minute at its peak.
    redis-tally: {}
  variants:
    # The database's CPU went on the contention: twice of it still breaks
    # on hot rows.
    bigger-db: { verdict: broke, diagnoses: [hot-rows] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line. The scored question is the relative one: whether twice the
# database's CPU holds the vote. Its answer goes into
# variants/bigger-db/design.yaml, the design with that change, and that
# run scores it. It's the stable result: bigger-db never held. It broke
# 2:50 and 4:10 into the load (the starting design 2:50 to 3:50), and in
# the two checks before the hold it collapsed in the ramp's last window.
# The Redis tally always held.
#
# The load guess is a loose, secondary question. Where hot rows tip over
# moves from run to run: the starting design broke at about 3,335, 3,873
# and 4,410 rps over three checks on the reference machine, and that
# isn't the host: the two furthest apart had host speed indexes of 1021
# and 1031. So it scores right within 35%, not the usual 25%, too high or
# too low both counting as wrong: at 25%, a guess equal to one run's break
# (3,335) would score wrong against another's (4,410, +32%). At 35%,
# every break seen scores right against every other.
#
# The load ramps from 200 to 4,500 rps over 4 minutes, then holds 4,500
# for a minute, so a late break counts: a design that gave out in the
# ramp's last window was only a stall, and the check came out
# inconclusive.
predict:
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
  - ask: How busy is the database's CPU when it does?
    answer: text
    expect: 'note: "database CPU when it gives out: {answer}"'
  - ask: Would a database with twice the CPU take the vote without breaking? Answer yes or no. Your answer goes into variants/bigger-db/design.yaml, this design with twice the database's CPU, and its run scores it.
    answer: yesno
    design: variants/bigger-db/design.yaml
    expect: break_load_rps none
    no: break_load_rps any
  - ask: At what offered load, in requests per second, will this design break? The load ramps from 200 to 4,500 rps, then holds there for a minute. A rough guess is fine, and it scores loosely, within 35%; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 35% of {answer}
    never: break_load_rps none
