title: When do you need to scale your database?
level: 1
concepts: [saturation, queueing knee, connection pools]
minutes: 45

# Available to Docker at --scale 1, Loadlore's own containers included: the
# design and its tooling add up to 8 CPUs. Smaller hosts need a smaller
# --scale (loadl run warns and suggests one).
#
# reference and speed: the machine its numbers come from and its host speed
# index (pre-flight measured 844-1020 there across runs). CPU limits are
# fractions of the host's cores, so a slower machine breaks at a lower
# load; loadl run warns below 75% of this.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# What `loadl scenario check` verifies, at --scale 1. At small scales the
# 0.25-CPU-or-less Postgres stalls under CPU throttling and breaks early.
check:
  problem:
    verdict: broke
    diagnoses: [queueing-knee]
  solutions:
    # helps: holds, or serves min_gain x the starting design's peak
    # throughput or more. Measured at --scale 1: 4,085 rps against 2,950
    # (1.38x); an earlier pair measured 3,422 against 2,791 (1.23x).
    one-query-per-page: { min_gain: 1.15 }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml. A load guess scores right within 25%, too high or
# too low both count as wrong. The load ramps from 100 to 5,000 rps.
predict:
  - ask: At what offered load, in requests per second, will it break? The ramp goes from 100 to 5,000 rps; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 25% of {answer}
    never: break_load_rps none
  - ask: At what offered load will requests start failing, 1% or more of them? A load, or never.
    answer: rps
    expect: errors_load_rps within 25% of {answer}
    never: errors_load_rps none
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
