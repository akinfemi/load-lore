title: When do you need to scale your database?
level: 1
concepts: [saturation, queueing knee, connection pools]
minutes: 45

# Available to Docker at --scale 1, Loadlore's own containers included: the
# design and its tooling add up to 5.9 CPUs. Smaller hosts need a smaller
# --scale (loadl run warns and suggests one).
#
# reference and speed: the machine its numbers come from and its host speed
# index (pre-flight measured 844-1020 there across runs). CPU limits are
# fractions of the host's cores, so a slower machine breaks at a lower
# load; loadl run warns below 75% of this.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# Measured before disk profiles: its designs keep their disks until its
# next re-measure, so its reference results don't change. Then each
# Postgres names a profile (disk: { profile: gp3 }) and this line goes.
disk: legacy

# Load generator VUs started before the load, at --scale 1: the peak rate x
# slo.p99_ms (3,500 x 0.5 s), more than 1.5 x the most busy at once before a
# break in the check's runs (956, the one-query-per-page solution near the
# top of the ramp). k6 peaked at 1.4 GB in the starting design's run, after
# its break.
load:
  prealloc_vus: 1750
  peak_vus: 956
  from: when-to-scale-your-database-one-query-per-page-20261111-161415

# What `loadl scenario check` verifies, at --scale 1. At small scales the
# 0.25-CPU-or-less Postgres stalls under CPU throttling and breaks early.
check:
  problem:
    verdict: broke
    diagnoses: [queueing-knee]
  solutions:
    # helps: holds, or serves min_gain x the starting design's peak
    # throughput or more. At --scale 1 with a 0.4-CPU Postgres and a
    # 3,500 rps peak it held the profile, against 2,873 rps for the
    # starting design (at least 1.22x).
    one-query-per-page: { min_gain: 1.15 }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml. A load guess scores right within 25%, too high or
# too low both count as wrong. The load ramps from 100 to 3,500 rps.
predict:
  - ask: At what offered load, in requests per second, will it break? The ramp goes from 100 to 3,500 rps. A rough guess is fine; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 25% of {answer}
    never: break_load_rps none
  - ask: At what offered load will requests start failing, 1% or more of them? A rough guess, or never.
    answer: rps
    expect: errors_load_rps within 25% of {answer}
    never: errors_load_rps none
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
