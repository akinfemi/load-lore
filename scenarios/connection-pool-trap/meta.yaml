title: The connection pool trap
level: 1
concepts: [connection pools, max_connections, PgBouncer]
minutes: 45

# Available to Docker at --scale 1, Loadlore's own containers included.
# reference and speed: the machine its numbers come from and its host speed
# index; loadl run warns below 75% of this.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# Load generator VUs started before the load, at --scale 1: the peak rate x
# slo.p99_ms (1,400 x 0.5 s), more than 1.5 x the most busy at once before a
# break in the check's runs (178, the starting design). k6 peaked at 940 MB
# in the starting design's run, after its break.
load:
  prealloc_vus: 700
  peak_vus: 178
  from: connection-pool-trap-20261111-120625

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [pool-exhausted]
  solutions:
    # helps: holds, or serves min_gain x the starting design's peak
    # throughput or more.
    pgbouncer: {}
    release-between-queries: {}
  variants:
    # The obvious fix: pools 3x bigger run into max_connections.
    bigger-pools: { verdict: broke, signals: [errors] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml. A load guess scores right within 25%, too high or
# too low both count as wrong. The load ramps from 100 to 1,400 rps.
predict:
  - ask: At what offered load, in requests per second, will it break? The ramp goes from 100 to 1,400 rps. A rough guess is fine; answer never if you think it holds.
    answer: rps
    expect: break_load_rps within 25% of {answer}
    never: break_load_rps none
  - ask: At what offered load will requests start failing, 1% or more of them? A rough guess, or never.
    answer: rps
    expect: errors_load_rps within 25% of {answer}
    never: errors_load_rps none
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
  - ask: If you made the api's pools three times bigger, what would happen?
    answer: text
    expect: 'note: "pools 3x bigger: {answer}"'
