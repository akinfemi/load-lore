title: The connection pool trap
level: 1
concepts: [connection pools, max_connections, PgBouncer]
minutes: 45

# Available to Docker at --scale 1, Loadlore's own containers included.
# reference and speed: the machine its numbers come from and its host speed
# index; loadl run warns below 75% of this.
host:
  cpus: 8
  memory: 8g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    diagnoses: [pool-exhausted]
  solutions:
    # helps: holds, or serves min_gain x the starting design's peak
    # throughput or more.
    pgbouncer: {}
    release-between-queries: {}
  variants:
    # The obvious fix: pools 3x bigger run into max_connections.
    bigger-pools: { verdict: broke, signals: [errors] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml. The load ramps from 100 to 1,400 rps.
predict:
  - ask: At what offered load, in requests per second, will p99 pass 500 ms? The ramp goes from 100 to 1,400 rps; answer never if you think it stays fast.
    answer: rps
    expect: p99_ms < 500 until load_rps >= {answer}
    never: p99_ms < 500 throughout
  - ask: At what offered load will 1% or more of requests fail? A load, or never.
    answer: rps
    expect: error_rate < 1% until load_rps >= {answer}
    never: error_rate < 1% throughout
  - ask: Which component gives out first?
    answer: service
    expect: 'note: "{answer} gives out first"'
  - ask: If you made the api's pools three times bigger, what would happen?
    answer: text
    expect: 'note: "pools 3x bigger: {answer}"'
