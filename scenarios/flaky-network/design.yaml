version: 1
name: flaky-network

# A product listing page: each request asks the inventory service about
# each of the 10 products on the page, one call at a time. Inventory
# answers in a couple of milliseconds, so the api gives each call 150 ms,
# which seemed generous.

services:
  lb:
    kind: lb
    target: api
    health_check: { interval_ms: 2000, fall: 3, rise: 2 }

  api:
    image: loadlore/synthetic
    replicas: 2
    resources: { cpu: 0.5, memory: 256m }
    behavior:
      cpu_ms: 0.3
      calls:
        - { target: inventory, op: http, count: 10 }   # one per product on the page
      resilience:
        timeout_ms: 150
    pools:
      inventory: 50

  inventory:
    image: loadlore/synthetic
    resources: { cpu: 1, memory: 256m }
    behavior:
      cpu_ms: 0.1

workload:
  entry: lb
  profile:
    - ramp: { from: 50, to: 300, over: 30s }
    - hold: { rps: 300, for: 3m30s }
  mix: { read: 1.0 }

# From 1:01, inventory's network loses 1% of the packets it sends, for two
# minutes: a bad cable, a busy switch, a noisy neighbour on the host.
scenario:
  - { at: 1m1s, inject: loss, target: inventory, percent: 1, for: 2m }

# Your predictions, scored in the report. Replace these with your own
# before you run it.
expect:
  - error_rate < 1%
