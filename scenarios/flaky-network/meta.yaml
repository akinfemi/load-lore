title: The flaky network
level: 2
concepts: [packet loss, TCP retransmits, fan-out, timeouts]
minutes: 40

# Available to Docker at --scale 1, Loadlore's own containers included.
# reference and speed: the machine its numbers come from and its host speed
# index; loadl run warns below 75% of this. The loss's cost comes from TCP's
# retransmit timer, not the host's speed, so the numbers move little.
host:
  cpus: 6
  memory: 4g
  reference: MacBook Air M4 on mains power, Colima VM with 8 vCPUs
  speed: 1000

# Measured before disk profiles: its designs keep their disks until its
# next re-measure, so its reference results don't change. Then each
# Postgres names a profile (disk: { profile: gp3 }) and this line goes.
disk: legacy

# Load generator VUs started before the load, at --scale 1: the peak rate x
# slo.p99_ms (300 x 0.5 s), well above 1.5 x the most busy at once before a
# break in the check's runs (13).
load:
  prealloc_vus: 150
  peak_vus: 13
  from: flaky-network-timeout-for-the-tail-20261112-110604

# What `loadl scenario check` verifies, at --scale 1.
check:
  problem:
    verdict: broke
    signals: [errors]
  solutions:
    # helps: holds through the loss.
    timeout-for-the-tail: { verdict: held }
    one-retry: { verdict: held }
  variants:
    # TCP waits at least 200 ms before resending, so a 200 ms timeout still
    # fails the calls that need a resend.
    timeout-200ms: { verdict: broke, signals: [errors] }

# What `loadl predict` asks before a run; each answer becomes an expect
# line in design.yaml.
predict:
  - ask: What share of page requests fail while 1% of inventory's packets are lost?
    answer: text
    expect: 'note: "pages failing during the loss: {answer}"'
  - ask: How long does a call whose reply lost a packet take?
    answer: text
    expect: 'note: "a call that lost a packet takes: {answer}"'
  - ask: Which component is the busiest during the loss?
    answer: service
    expect: 'note: "{answer} is the busiest during the loss"'
  - ask: If you raised the timeout to 200 ms, what would change?
    answer: text
    expect: 'note: "a 200 ms timeout: {answer}"'
