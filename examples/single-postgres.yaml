version: 1
name: when-to-scale-your-database

services:
  lb:
    kind: lb
    target: api
    health_check: { interval_ms: 2000, fall: 3, rise: 2 }

  api:
    image: loadlore/synthetic
    replicas: 4
    resources: { cpu: 0.8, memory: 512m }   # 4 x 0.8 keeps the run within 8 vCPUs, tooling included
    behavior:
      cpu_ms: 0.5
      calls:
        - { target: db, op: read,  count: 3 }
        - { target: db, op: write, count: 1, when: write }
    pools: { db: { size: 24, min: 24 } }   # opened at start; 4 x 24 = 96, exporter and reserved slots need the rest

  db:
    kind: postgres
    version: "17"
    resources: { cpu: 0.4, memory: 1g }   # starting point; tuned by measurement
    config: { max_connections: 100, shared_buffers: 256MB }
    dataset: { rows: 5000000, row_bytes: 512 }

workload:
  entry: lb
  profile:
    - ramp: { from: 100, to: 3500, over: 5m }
    - hold: { rps: 3500, for: 2m }
  mix: { read: 0.9, write: 0.1 }
  keys: { distribution: zipf, skew: 1.1, count: 5000000 }

expect:
  - break_load_rps within 25% of 3000
  - errors_load_rps none
