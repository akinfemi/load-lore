# Generated by loadl for run test-run. Inspect it, or rerun the stack with
# docker compose -f compose.yaml up -d (the data volume must exist).
name: loadlore-test-run
services:
  api-0:
    image: loadlore/synthetic:dev
    pull_policy: never
    environment:
      LOADLORE_SYNTHETIC_CONFIG: '{"service":"api","replica":0,"listen":":8080","concurrency":{"model":"threads","max":200},"cpu_ms":1,"cpu_jitter":0.1,"alloc_kb":0,"calls":[{"target":"cache","op":"get","count":1,"when":"read","mode":"sync","on_miss":[{"target":"db","op":"read","count":1,"when":"always","mode":"sync","query":"point"},{"target":"cache","op":"set","count":1,"when":"always","mode":"sync","ttl_s":60}]},{"target":"db","op":"write","count":1,"when":"write","mode":"sync"}],"resilience":{"timeout_ms":1000},"targets":{"cache":{"kind":"redis","addrs":["lore-toxiproxy:20000"],"pool":10,"row_bytes":256},"db":{"kind":"postgres","addrs":["lore-toxiproxy:20001"],"pool":10,"database":"lab","user":"loadlore","password":"loadlore","rows":20000,"row_bytes":256}}}'
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      io.loadlore: "1"
      io.loadlore.replica: "0"
      io.loadlore.role: app
      io.loadlore.run: test-run
      io.loadlore.service: api
    networks:
      - lab
    healthcheck:
      test:
        - CMD
        - /synthetic
        - healthcheck
      interval: 1s
      timeout: 3s
      retries: 120
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      lore-toxiproxy:
        condition: service_started
    restart: "no"
  api-1:
    image: loadlore/synthetic:dev
    pull_policy: never
    environment:
      LOADLORE_SYNTHETIC_CONFIG: '{"service":"api","replica":1,"listen":":8080","concurrency":{"model":"threads","max":200},"cpu_ms":1,"cpu_jitter":0.1,"alloc_kb":0,"calls":[{"target":"cache","op":"get","count":1,"when":"read","mode":"sync","on_miss":[{"target":"db","op":"read","count":1,"when":"always","mode":"sync","query":"point"},{"target":"cache","op":"set","count":1,"when":"always","mode":"sync","ttl_s":60}]},{"target":"db","op":"write","count":1,"when":"write","mode":"sync"}],"resilience":{"timeout_ms":1000},"targets":{"cache":{"kind":"redis","addrs":["lore-toxiproxy:20000"],"pool":10,"row_bytes":256},"db":{"kind":"postgres","addrs":["lore-toxiproxy:20001"],"pool":10,"database":"lab","user":"loadlore","password":"loadlore","rows":20000,"row_bytes":256}}}'
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      io.loadlore: "1"
      io.loadlore.replica: "1"
      io.loadlore.role: app
      io.loadlore.run: test-run
      io.loadlore.service: api
    networks:
      - lab
    healthcheck:
      test:
        - CMD
        - /synthetic
        - healthcheck
      interval: 1s
      timeout: 3s
      retries: 120
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
      lore-toxiproxy:
        condition: service_started
    restart: "no"
  cache:
    image: redis:8.2
    pull_policy: missing
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 98304kb
      - --maxmemory-policy
      - allkeys-lru
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      io.loadlore: "1"
      io.loadlore.role: datastore
      io.loadlore.run: test-run
      io.loadlore.service: cache
    networks:
      - lab
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 1s
      timeout: 3s
      retries: 60
    restart: "no"
  db:
    image: postgres:17.11
    pull_policy: missing
    command:
      - postgres
    environment:
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: loadlore
      POSTGRES_USER: loadlore
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    shm_size: 128m
    labels:
      io.loadlore: "1"
      io.loadlore.role: datastore
      io.loadlore.run: test-run
      io.loadlore.service: db
    networks:
      - lab
    volumes:
      - data-db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U loadlore -d lab -h 127.0.0.1
      interval: 1s
      timeout: 3s
      retries: 180
    restart: "no"
    stop_grace_period: 10s
  lb:
    image: haproxy:3.2.26
    pull_policy: missing
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      io.loadlore: "1"
      io.loadlore.role: lb
      io.loadlore.run: test-run
      io.loadlore.service: lb
    networks:
      - lab
    configs:
      - source: haproxy-lb
        target: /usr/local/etc/haproxy/haproxy.cfg
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8405
      interval: 1s
      timeout: 3s
      retries: 60
    depends_on:
      api-0:
        condition: service_healthy
      api-1:
        condition: service_healthy
      lore-toxiproxy:
        condition: service_started
    restart: "no"
  lore-cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=1s
      - --store_container_labels=false
      - --whitelisted_container_labels=io.loadlore.run,io.loadlore.service,io.loadlore.replica,io.loadlore.role
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    cpus: 0.1
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      io.loadlore: "1"
      io.loadlore.role: infra
      io.loadlore.run: test-run
      io.loadlore.service: lore-cadvisor
    networks:
      - lab
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: "no"
  lore-k6:
    image: grafana/k6:2.3.0
    command:
      - run
      - --quiet
      - --no-usage-report
      - -o
      - experimental-prometheus-rw
      - /scripts/load.js
    environment:
      GOMEMLIMIT: 921MiB
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 1s
      K6_PROMETHEUS_RW_SERVER_URL: http://lore-prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
    cpus: 1
    mem_limit: 1024m
    memswap_limit: 1024m
    labels:
      io.loadlore: "1"
      io.loadlore.role: load
      io.loadlore.run: test-run
      io.loadlore.service: lore-k6
    networks:
      - lab
    configs:
      - source: k6
        target: /scripts/load.js
    profiles:
      - load
    restart: "no"
  lore-pgexp-db:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_PASS: loadlore
      DATA_SOURCE_URI: db:5432/lab?sslmode=disable
      DATA_SOURCE_USER: loadlore
    cpus: 0.1
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      io.loadlore: "1"
      io.loadlore.role: exporter
      io.loadlore.run: test-run
      io.loadlore.service: db
    networks:
      - lab
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  lore-prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    cpus: 0.1
    mem_limit: 1024m
    memswap_limit: 1024m
    labels:
      io.loadlore: "1"
      io.loadlore.role: infra
      io.loadlore.run: test-run
      io.loadlore.service: lore-prometheus
    networks:
      - lab
    ports:
      - 127.0.0.1::9090
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/ready
      interval: 1s
      timeout: 3s
      retries: 60
    restart: "no"
  lore-redisexp-cache:
    image: oliver006/redis_exporter:v1.97.0
    environment:
      REDIS_ADDR: redis://cache:6379
    cpus: 0.1
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      io.loadlore: "1"
      io.loadlore.role: exporter
      io.loadlore.run: test-run
      io.loadlore.service: cache
    networks:
      - lab
    depends_on:
      cache:
        condition: service_healthy
    restart: "no"
  lore-toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command:
      - -host=0.0.0.0
      - -config=/config/toxiproxy.json
      - -proxy-metrics
      - -runtime-metrics
    environment:
      GOMEMLIMIT: 921MiB
    cpus: 0.5
    mem_limit: 1024m
    memswap_limit: 1024m
    labels:
      io.loadlore: "1"
      io.loadlore.role: infra
      io.loadlore.run: test-run
      io.loadlore.service: lore-toxiproxy
    networks:
      - lab
    ports:
      - 127.0.0.1::8474
    configs:
      - source: toxiproxy
        target: /config/toxiproxy.json
    restart: "no"
networks:
  lab:
    labels:
      io.loadlore: "1"
      io.loadlore.run: test-run
volumes:
  data-db:
    external: true
    name: loadlore-test-run-db-data
configs:
  haproxy-lb:
    content: |
      global
          maxconn 50000

      defaults
          mode http
          timeout connect 5s
          timeout client 60s
          timeout server 60s
          timeout http-keep-alive 60s
          timeout check 1000ms

      frontend web
          bind :8080
          default_backend replicas

      frontend stats
          bind :8405
          http-request use-service prometheus-exporter if { path /metrics }

      backend replicas
          balance roundrobin
          option httpchk GET /healthz
          default-server check inter 1000ms fall 2 rise 2
          server api-0 lore-toxiproxy:20002
          server api-1 lore-toxiproxy:20003
  k6:
    content: |
      // script
  prometheus:
    content: |
      global:
        scrape_interval: 1s
        scrape_timeout: 1s
        evaluation_interval: 5s
        external_labels:
          run: "test-run"
      scrape_configs:
        - job_name: synthetic
          static_configs:
            - targets: ["api-0:8080", "api-1:8080"]
        - job_name: postgres-db
          static_configs:
            - targets: ["lore-pgexp-db:9187"]
              labels: {service: "db"}
        - job_name: redis-cache
          static_configs:
            - targets: ["lore-redisexp-cache:9121"]
              labels: {service: "cache"}
        - job_name: lb-lb
          static_configs:
            - targets: ["lb:8405"]
              labels: {service: "lb"}
        - job_name: toxiproxy
          static_configs:
            - targets: ["lore-toxiproxy:8474"]
        - job_name: cadvisor
          static_configs:
            - targets: ["lore-cadvisor:8080"]
          metric_relabel_configs:
            - source_labels: [container_label_io_loadlore_run]
              regex: "test-run"
              action: keep
            - source_labels: [container_label_io_loadlore_service]
              target_label: service
            - source_labels: [container_label_io_loadlore_replica]
              target_label: replica
            - source_labels: [container_label_io_loadlore_role]
              target_label: role
            - regex: "container_label_.*|id"
              action: labeldrop
  toxiproxy:
    content: |-
      [
        {
          "name": "api--cache",
          "listen": "0.0.0.0:20000",
          "upstream": "cache:6379",
          "enabled": true
        },
        {
          "name": "api--db",
          "listen": "0.0.0.0:20001",
          "upstream": "db:5432",
          "enabled": true
        },
        {
          "name": "lb--api-0",
          "listen": "0.0.0.0:20002",
          "upstream": "api-0:8080",
          "enabled": true
        },
        {
          "name": "lb--api-1",
          "listen": "0.0.0.0:20003",
          "upstream": "api-1:8080",
          "enabled": true
        }
      ]
