# Eval set for the loadlore-designer skill. Run in CI whenever the schema or the skill changes.
# Each case: a user prompt, and checks on what the agent must and must not produce.
# `validates` means `loadl validate --json` passes on the resulting design.
# Fixture repos are in fixtures/. Run with: go run ./cmd/skilleval (see
# cmd/skilleval; each case and judged check is a paid model call).
# continues: a follow-up that resumes an earlier case's session and workspace.
# user_replicas: how many replicas the prompt asked for (replicas_beyond_user).

cases:
  # Several replicas without saying how traffic reaches them: the skill
  # asks before writing a design.
  - id: replicas-ask-spread
    prompt: "I have a REST API with 2 instances in front of one Postgres. Mostly reads. I want to see when it falls over."
    checks:
      asks_how_traffic_spreads: true

  - id: basic-api-postgres
    prompt: "I have a REST API with 2 instances behind a load balancer, in front of one Postgres. Mostly reads, peaking at about 300 requests a second. I want to see when it falls over."
    user_replicas: 2
    checks:
      validates: true
      services_include: [api, db]
      must_not_add: [cache, pgbouncer, replicas_beyond_user, resilience]
      assumptions_present_for: [services.api.behavior.cpu_ms, workload.profile]
      asks_for_prediction: true

  - id: no-unrequested-cache
    prompt: "Same as before but traffic is 10x. Build it."
    continues: basic-api-postgres
    checks:
      validates: true
      must_not_add: [cache, queue]
      gives_away_answer: false

  - id: hit-rate-request
    prompt: "Add a Redis cache with a 90% hit rate."
    fixture: fixtures/api-postgres/
    checks:
      validates: true
      field_absent: hit_rate
      explains_emergent_hit_rate: true
      assumptions_present_for: [workload.keys]

  - id: advice-when-asked
    prompt: "My p99 blew up at 3k rps because connections maxed out. What should I add?"
    checks:
      offers_options: { min: 2, max: 3 }
      includes_tradeoffs: true
      edits_design_without_choice: false

  - id: from-code-n-plus-one
    prompt: "Model the /orders endpoint from this repo."
    fixture: fixtures/orders-n-plus-one/
    checks:
      validates: true
      detects: n_plus_one
      basis_for_calls: from-code
      fixes_n_plus_one: false

  - id: cloud-needs-consent
    prompt: "Run it on AWS."
    checks:
      runs_cloud_without_budget: false
      asks_for_budget: true

  - id: scenario-no-spoilers
    # A topic the library doesn't cover yet, so the agent writes rather
    # than points at an existing scenario.
    prompt: "Write a scenario about hot rows: many requests updating the same few rows in Postgres."
    checks:
      files_present: [README.md, design.yaml, hints.md, meta.yaml, solutions/]
      readme_contains_answer: false
      hints_progressive: true
      scenario_check_passes: true
